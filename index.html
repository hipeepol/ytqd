<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ytqd</title>
    <link rel="icon" type="image/png" href="images/ytqdlogo.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        body{
          background-color: black;
          color: white;
          font-family: serif;
          text-align: center;
          font-size: 1em;
        }
        h1{
          font-family: serif;
          text-align: center;
          font-size: 4em;
          margin: 5%;
        }
        button{
          font-family: serif;
          font-size: 1em;
          padding: 10px;
        }
    </style>
</head>
<body>
    <h1 id="title">ytqd</h1>
    
    <button type="button" id="random">random</button>

    <br> <img src = "image" title = "title" width = "50%">
    <br> <p id="caption"></p>

    <button onclick="document.getElementById('title').scrollIntoView({behavior: 'smooth'})" type="button">go to top.</button>
    
  <script>
    const images = [
        { 
            ima: 'images/1.png',
            tit:'found this image on wikipedia and edited it https://commons.wikimedia.org/wiki/File:Pselectin.PNG',
            cap: 'a really cool p-selectin'
        }
    ];
      
    const img = document.getElementById('image');
    const button = document.getElementById('random');

    function randoming() {
        const random = Math.floor(Math.random() * images.length);
        const selected = images[random];
         document.getElementById('image').src = selected.ima;
        document.getElementById('title').textContent = selected.tit;
        document.getElementById('caption').textContent = selected.cap;
    }

    randoming();

    button.addEvent Listener('click', randoming);
  </script>
</body>
</html>
